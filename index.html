<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Make-Your-Game</title>

</head>

<body>
    <div id="game">

        <div id="settingScreen" class="animate">
            <!-- <img src="./assets/images.jpeg" alt=""> -->
        </div>
        <div id="gameSetting">
            <h1 id="title"> Welcome Hero Let's Bomb it </h1><br>
            <h1 id="instructions">- Use Arrows to Move & SPACE to Bomb<br>- Press P to START</h1>
        </div>
        <div id="map">
            <div id="gameBar">
                <div id="Time">Time</div>
                <div id="Score">SCORE  
                    <div><img src="./assets/score.png" alt=""> </div>
                    <div id="score"></div>
                </div>
                <div id="heart">LEFT
                    <div><img src="./assets/heart.png" alt=""> </div>
                    <div id="numOfHeart"></div>
                </div>
            
            </div>
        </div>

    </div>

    <script type="module" src="./index.js" defer></script>


</body>

</html>
